info:
  contact: {}
  description: |-
    Menggabungkan inventaris aset, laporan lapangan, dan peta jaringan irigasi menjadi satu gambaran kondisi jaringan, untuk membantu menentukan prioritas pemeliharaan.

    ## Cara memakai dokumentasi ini

    1. Buka `GET /api/health` lebih dulu. Selama jawabannya `{"status":"memuat"}`, alamat lain menjawab 503. Lanjutkan setelah `{"status":"siap"}`.
    2. Pilih alamat di menu kiri, lalu klik **Test Request**.
    3. Isi parameter yang bertanda **Required**, misalnya `kode_aset` dengan `KW-0001`. Daftar kode ada di `GET /api/aset`.
    4. Filter bersifat opsional. Hapus centang filter yang tidak dipakai. Filter yang dicentang digabung dengan "dan", jadi `jenis=bendung` bersama `kondisi=baik` bisa memberi daftar kosong.
    5. Klik **Send**. Jawaban asli muncul di panel kanan.

    Kotak contoh di samping tiap alamat hanya menunjukkan bentuk jawaban. Nilainya contoh dari soal, bukan isi data.

    ## Contoh permintaan

    | Tujuan | Permintaan |
    | --- | --- |
    | Status impor | `GET /api/health` |
    | Semua bangunan | `GET /api/aset` |
    | Bangunan rusak berat | `GET /api/aset?kondisi=rusak_berat` |
    | Satu bangunan dan riwayat laporannya | `GET /api/aset/KW-0001` |
    | Petak terdampak di hilir bangunan | `GET /api/aset/KW-0001/dampak` |
    | Sepuluh prioritas teratas | `GET /api/prioritas?limit=10` |
    | Panjang saluran per tingkat dan kondisi | `GET /api/rekap/saluran` |
    | Jumlah temuan per kategori | `GET /api/kualitas-data` |
    | Impor laporan susulan dari folder data | `POST /api/impor/susulan` tanpa isi |

    Dari terminal: `curl http://localhost:8080/api/aset/KW-0001`

    ## Bila terjadi galat

    Semua galat berbentuk `{"error": {"code": "...", "message": "...", "request_id": "..."}}`. Status 400 berarti parameter salah, 404 data tidak ada, 503 impor belum selesai.
  title: Irrigation Network Condition API
  version: 1.0.0
paths:
  /api/aset:
    get:
      description: Every structure with its latest condition. Filters accept the same
        spelling variants as the source files, so `RR` selects `rusak_ringan`. A structure
        without geometry has `lon` and `lat` set to null.
      parameters:
      - description: Structure type
        enum:
        - bendung
        - bangunan_bagi
        - bangunan_sadap
        - bangunan_bagi_sadap
        - bangunan_pelengkap
        in: query
        name: jenis
        type: string
      - description: Latest condition
        enum:
        - baik
        - rusak_ringan
        - rusak_sedang
        - rusak_berat
        in: query
        name: kondisi
        type: string
      - description: Canal name, case-insensitive
        in: query
        name: saluran
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/asset.ListResponse'
        "400":
          description: Unknown jenis or kondisi
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "503":
          description: The initial import has not finished
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: List irrigation structures
      tags:
      - assets
  /api/aset/{kode_aset}:
    get:
      description: '`riwayat` holds every report matched to the structure, newest
        first, cancelled ones included. Reports dropped as duplicates are left out.'
      parameters:
      - description: Asset code, e.g. KW-0012
        example: KW-0001
        in: path
        name: kode_aset
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/asset.DetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "503":
          description: The initial import has not finished
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Get one structure with its report history
      tags:
      - assets
  /api/aset/{kode_aset}/dampak:
    get:
      description: 'The tertiary plots that lose water when the structure fails: every
        plot whose water path from the weir passes through it, including plots tapped
        at the structure itself. A structure without geometry or flagged `jauh_dari_saluran`
        has an impacted area of 0.'
      parameters:
      - description: Asset code, e.g. KW-0012
        example: KW-0001
        in: path
        name: kode_aset
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/asset.ImpactResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "503":
          description: The initial import has not finished
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Downstream impact of one structure
      tags:
      - assets
  /api/health:
    get:
      description: '`memuat` while the data folder is being imported, `siap` once
        it has finished. Always answers 200, because the checker polls it during the
        import. Every other endpoint answers 503 until the status is `siap`.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.StatusResponse'
      summary: Import status
      tags:
      - health
  /api/impor/susulan:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Imports `laporan_susulan.xlsx` from the data folder: new reports are added, reports with a known `id_laporan` replace the stored one, and reports with status `batal` are cancelled. The latest condition and the priorities are recomputed. Safe to repeat: a second call reports every row as `tidak_berubah` and leaves the same state.

        Optional: send the request as `multipart/form-data` with an `.xlsx` in the field `berkas` to import that file instead. The same cleaning rules apply and the response has the same shape. A request without a body always reads the data folder.
      parameters:
      - description: Follow-up workbook (.xlsx, at most 10 MB). Leave out to read
          the data folder.
        in: formData
        name: berkas
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ingest.FollowUpResponse'
        "400":
          description: The upload has no file in `berkas`, or the file is larger than
            10 MB
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: The follow-up file is not in the data folder
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "422":
          description: The file is not a readable workbook, or has no `id_laporan`
            column
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "503":
          description: The initial import has not finished
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Import the follow-up reports
      tags:
      - import
  /api/kualitas-data:
    get:
      description: Counted per source row or feature that was repaired, flagged or
        dropped, across every imported file. The eleven categories required by the
        assignment are always present, with 0 when nothing was found; extra categories
        follow.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quality.SummaryResponse'
        "503":
          description: The initial import has not finished
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Number of data-quality findings per category
      tags:
      - quality
  /api/kualitas-data/temuan:
    get:
      description: 'Not part of the assignment contract; added for the data-quality
        page. One row per cleaning action: source file, row reference, problem and
        the action taken.'
      parameters:
      - description: Finding category, e.g. aset_ganda
        in: query
        name: kategori
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quality.FindingListResponse'
        "503":
          description: The initial import has not finished
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: List data-quality findings
      tags:
      - quality
  /api/peta/petak:
    get:
      description: 'Not part of the assignment contract; added for the map. Geometry
        is WGS84. Properties: `kode_petak`, `nama_petak`, `luas_ha`, `luas_baku_ha`,
        `luas_geometri_ha`, `nomenklatur_sadap`, `kode_aset_sadap`, `tanda`.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/geojson.FeatureCollection'
        "503":
          description: The initial import has not finished
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Tertiary plots as GeoJSON
      tags:
      - map
  /api/peta/saluran:
    get:
      description: 'Not part of the assignment contract; added for the map. Geometry
        is WGS84. Properties: `id_ruas`, `nama_saluran`, `tingkat`, `kondisi`, `panjang_m`.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/geojson.FeatureCollection'
        "503":
          description: The initial import has not finished
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Canal segments as GeoJSON
      tags:
      - map
  /api/prioritas:
    get:
      description: Score = condition weight (baik 0, rusak_ringan 1, rusak_sedang
        2, rusak_berat 4) x impacted area. Only scores above 0 are listed, highest
        first; ties are ordered by `kode_aset`.
      parameters:
      - default: 20
        description: Maximum number of rows
        in: query
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/asset.PriorityListResponse'
        "400":
          description: limit is not a positive integer
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "503":
          description: The initial import has not finished
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Maintenance priority list
      tags:
      - assets
  /api/rekap/saluran:
    get:
      description: Segment lengths are measured on EPSG:32749 and summed after duplicate
        segments are removed, in kilometres with two decimals.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/canal.RecapListResponse'
        "503":
          description: The initial import has not finished
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Canal length per level and condition
      tags:
      - canals
schemes:
- http
swagger: "2.0"
tags:
- description: Import status
  name: health
- description: 'Irrigation structures: list, report history, downstream impact, maintenance
    priority'
  name: assets
- description: Canal length recap
  name: canals
- description: Data-quality findings from the import
  name: quality
- description: Follow-up report import
  name: import
- description: GeoJSON layers for the map (outside the assignment contract)
  name: map
