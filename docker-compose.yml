# The backend service with its database. Run it from the repo root
# (`docker compose up --build`, which includes this file) or from this folder.
# The API listens on http://localhost:8080/api.
name: be-irrigation

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-irigasi}
      POSTGRES_USER: ${POSTGRES_USER:-irigasi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irigasi}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-irigasi} -d ${POSTGRES_DB:-irigasi}"]
      interval: 3s
      timeout: 3s
      retries: 40

  backend:
    build: .
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-irigasi}:${POSTGRES_PASSWORD:-irigasi}@db:5432/${POSTGRES_DB:-irigasi}?sslmode=disable
      DATA_DIR: /data
    volumes:
      # The source files stay in data/ at the repo root: the assignment fixes
      # that location and the checker replaces its content before starting.
      # They are mounted, not baked into the image.
      - ${DATA_PATH:-../data}:/data:ro
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
