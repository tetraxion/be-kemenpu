# The backend service with its database, as its own Compose project.
# Start it from this folder: `make up` or `docker compose up --build`.
#
#   http://localhost:8081/api   the API, directly
#   http://localhost:8080/api   the same API through the gateway of ../frontend
name: be-irrigation

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-irigasi}
      POSTGRES_USER: ${POSTGRES_USER:-irigasi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irigasi}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-irigasi} -d ${POSTGRES_DB:-irigasi}"]
      interval: 3s
      timeout: 3s
      retries: 40

  backend:
    build: .
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-irigasi}:${POSTGRES_PASSWORD:-irigasi}@db:5432/${POSTGRES_DB:-irigasi}?sslmode=disable
      DATA_DIR: /data
      DATA_OVERRIDE_DIR: /data-override
    volumes:
      # The source files ship with this service. They are mounted, not baked
      # into the image.
      - ./data:/data:ro
      - ${DATA_OVERRIDE_PATH:-../data}:/data-override:ro
    ports:
      # 8080 belongs to the gateway in ../frontend, which serves the interface
      # and forwards /api here.
      - "${HTTP_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
